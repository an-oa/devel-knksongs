<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- ogp.png（1200x630）の描画元。npm run render:brand-assets で書き出す。 -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
    background: #ffc928;
    color: #1b1b1b;
    position: relative;
    overflow: hidden;
  }
  /* 赤のチェック柄はマフラーのモチーフとして上下の細い帯だけに使う。 */
  .tartan {
    position: absolute;
    left: 0;
    right: 0;
    height: 18px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.45) 0 6px, transparent 6px 30px),
      repeating-linear-gradient(90deg, transparent 0 14px, rgba(255,255,255,.35) 14px 16px, transparent 16px 30px),
      repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 4px, transparent 4px 9px),
      #c62828;
  }
  .tartan.top { top: 0; }
  .tartan.bottom { bottom: 0; }
  .panel {
    position: absolute;
    top: 18px;
    bottom: 18px;
    left: 0;
    width: 400px;
    background: #fff;
    overflow: hidden;
    border-right: 6px solid #1b1b1b;
  }
  .panel .spots { position: absolute; inset: 0; width: 100%; height: 100%; }
  .panel .bell {
    position: absolute;
    width: 280px;
    height: 280px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }
  .wrap {
    position: absolute;
    top: 18px;
    bottom: 18px;
    left: 406px;
    right: 0;
    padding: 64px 64px 44px 60px;
    display: flex;
    flex-direction: column;
  }
  .title {
    margin: 0;
    font-size: 76px;
    font-weight: 900;
    line-height: 1.12;
    letter-spacing: 0.01em;
  }
  .lead {
    margin: 22px 0 0;
    font-size: 30px;
    font-weight: 700;
    color: #2b2b2b;
  }
  .search {
    margin-top: 36px;
    height: 78px;
    border-radius: 14px;
    background: #fff;
    border: 4px solid #1b1b1b;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 24px;
    font-size: 29px;
    color: #4b4b4b;
  }
  .search svg { width: 34px; height: 34px; flex: none; }
  .tags {
    margin-top: 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 24px;
    font-weight: 700;
    padding: 4px 16px;
    border-radius: 8px;
    background: #1b1b1b;
    color: #fff;
  }
  .foot {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    font-size: 22px;
    font-weight: 700;
    color: #2b2b2b;
  }
</style>
</head>
<body>
  <div class="tartan top"></div>
  <div class="panel">
    <svg class="spots" viewBox="0 0 400 594" preserveAspectRatio="none"><g fill="#1b1b1b">
      <path d="M-20 -20h170c10 34-12 58-46 66-34 9-46 40-84 36-22-2-24-40-40-102z"/>
      <path d="M300 40c30-14 80 0 110 30v120c-30 16-64 6-78-18-14-22-44-30-46-60-2-30-4-58 14-72z"/>
      <path d="M-20 400c34-18 76 0 90 30 14 30 0 70-18 104-14 26-40 60-72 80z"/>
      <path d="M270 470c26-22 74-18 92 10 12 18 10 46 0 70-6 16-14 40-24 64h-110c-8-48 4-112 42-144z"/>
      <path d="M150 290c10-8 26-6 30 4 4 9-4 20-16 22-12 2-20-14-14-26z"/>
    </g></svg>
    <img class="bell" src="../../public/bell.svg" alt="">
  </div>
  <div class="wrap">
    <h1 class="title">鐘輝かう<br>歌サーチ</h1>
    <p class="lead">歌った曲を、曲名・アーティスト名・読みで検索</p>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      曲名・歌手・読み...
    </div>
    <div class="tags">
      <span class="tag">配信</span>
      <span class="tag">歌みた</span>
      <span class="tag">ショート</span>
      <span class="tag">切り抜き</span>
      <span class="tag">収録</span>
    </div>
    <div class="foot">
      <span>an-oa.github.io/knksongs</span>
      <span>非公式ファンメイド</span>
    </div>
  </div>
  <div class="tartan bottom"></div>
</body>
</html>
