<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<!-- apple-touch-icon.png（180x180）の描画元。npm run render:brand-assets で書き出す。 -->
<style>
  html, body { margin: 0; }
  /* iOS が角丸を付けるため、背景は角まで描き、鐘は余白を取って中央に置く。 */
  body { width: 180px; height: 180px; background: #fff; position: relative; overflow: hidden; }
  .spots { position: absolute; inset: 0; }
  .bell { position: absolute; width: 128px; height: 128px; left: 26px; top: 26px; }
</style>
</head>
<body>
  <svg class="spots" viewBox="0 0 180 180"><g fill="#1b1b1b">
    <path d="M-10 -10h70c6 18-6 30-22 34-16 5-22 20-40 18-10-1-10-20-8-52z"/>
    <path d="M150 20c18-6 40 4 40 24v40c-14 6-30 2-36-10-6-11-20-14-20-28 0-12 6-22 16-26z"/>
    <path d="M-10 130c16-8 34 0 40 14 6 13 0 30-8 46h-32z"/>
    <path d="M128 150c12-10 34-8 40 6 4 9 2 22-4 34h-44c-2-14-2-30 8-40z"/>
  </g></svg>
  <img class="bell" src="../../public/bell.svg" alt="">
</body>
</html>
