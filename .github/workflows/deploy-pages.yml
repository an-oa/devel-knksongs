name: Deploy Pages

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  resolve:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deploy-sha: ${{ steps.target.outputs.deploy-sha }}
      is-current-main: ${{ steps.target.outputs.is-current-main }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Resolve deployment target
        id: target
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_main_sha="$(git rev-parse HEAD)"
          echo "deploy-sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          if [ "$DEPLOY_SHA" = "$current_main_sha" ]; then
            echo "is-current-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-current-main=false" >> "$GITHUB_OUTPUT"
            echo "Skip outdated deployment target: $DEPLOY_SHA (current main: $current_main_sha)"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.is-current-main == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.deploy-sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - run: npm ci

      - name: Prepare Pages artifact
        env:
          DEPLOY_SHA: ${{ needs.resolve.outputs.deploy-sha }}
        run: npm run build:pages-artifact

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  freshness:
    needs:
      - resolve
      - build
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.target.outputs.should-deploy }}

    steps:
      - name: Check deployment target is still main
        id: target
        env:
          DEPLOY_SHA: ${{ needs.resolve.outputs.deploy-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$DEPLOY_SHA" = "$current_main_sha" ]; then
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skip outdated deployment target: $DEPLOY_SHA (current main: $current_main_sha)"
          fi

  deploy:
    needs:
      - resolve
      - build
      - freshness
    if: needs.freshness.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Verify deployment target after waiting
        env:
          DEPLOY_SHA: ${{ needs.resolve.outputs.deploy-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$DEPLOY_SHA" != "$current_main_sha" ]; then
            echo "Reject outdated deployment target: $DEPLOY_SHA (current main: $current_main_sha)"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.deploy-sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0

      - name: Verify deployed commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.deploy-sha }}
        run: node scripts/verify-pages-deployment.mjs

      - name: Verify deployed commit is still main
        env:
          DEPLOY_SHA: ${{ needs.resolve.outputs.deploy-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$DEPLOY_SHA" != "$current_main_sha" ]; then
            echo "Deployed commit is no longer current main: $DEPLOY_SHA (current main: $current_main_sha)"
            exit 1
          fi

  notify:
    needs:
      - resolve
      - build
      - freshness
      - deploy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Update deployment failure issue
        env:
          ALERT_LABEL: workflow-failure
          ALERT_TITLE: "[Workflow Failure] Deploy Pages"
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          FRESHNESS_RESULT: ${{ needs.freshness.result }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          find_open_issue() {
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 100 \
              --search "\"$ALERT_TITLE\" in:title" \
              --json number,title \
              --jq 'map(select(.title == "[Workflow Failure] Deploy Pages"))[0].number // empty'
          }

          failure_detected=false
          for result in \
            "$RESOLVE_RESULT" \
            "$BUILD_RESULT" \
            "$FRESHNESS_RESULT" \
            "$DEPLOY_RESULT"; do
            if [ "$result" = "failure" ]; then
              failure_detected=true
              break
            fi
          done

          if [ "$failure_detected" = "true" ]; then
            gh label create "$ALERT_LABEL" \
              --repo "$GITHUB_REPOSITORY" \
              --color D73A4A \
              --description "Open while the Pages deployment workflow is failing" \
              --force

            issue_number="$(find_open_issue)"
            body_file="$RUNNER_TEMP/deploy-pages-failure.md"
            {
              echo "### Deployment workflow failure"
              echo
              echo "- Commit: $DEPLOY_SHA"
              echo "- Run: $RUN_URL"
              echo "- Attempt: $RUN_ATTEMPT"
              echo "- Resolve: $RESOLVE_RESULT"
              echo "- Build: $BUILD_RESULT"
              echo "- Freshness: $FRESHNESS_RESULT"
              echo "- Deploy: $DEPLOY_RESULT"
              echo "- Detected at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > "$body_file"

            if [ -n "$issue_number" ]; then
              gh issue edit "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --add-assignee "$REPOSITORY_OWNER" \
                --add-label "$ALERT_LABEL"
              gh issue comment "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --body-file "$body_file"
            else
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ALERT_TITLE" \
                --assignee "$REPOSITORY_OWNER" \
                --label "$ALERT_LABEL" \
                --body-file "$body_file"
            fi
            exit 0
          fi

          if [ "$DEPLOY_RESULT" != "success" ]; then
            echo "No deployment failure or recovery to report."
            exit 0
          fi

          if ! issue_number="$(find_open_issue)"; then
            echo "::warning::Could not query the deployment failure issue after a successful deploy."
            exit 0
          fi
          if [ -z "$issue_number" ]; then
            echo "No open deployment failure issue to close."
            exit 0
          fi

          recovery_file="$RUNNER_TEMP/deploy-pages-recovery.md"
          {
            echo "### Deployment recovered"
            echo
            echo "- Commit: $DEPLOY_SHA"
            echo "- Run: $RUN_URL"
            echo "- Attempt: $RUN_ATTEMPT"
            echo "- Recovered at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$recovery_file"

          if ! gh issue comment "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$recovery_file"; then
            echo "::warning::Could not add the deployment recovery comment."
            exit 0
          fi
          if ! gh issue close "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --reason completed; then
            echo "::warning::Could not close the recovered deployment failure issue."
          fi
