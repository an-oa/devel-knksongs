name: Update songs json

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6,18 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: update-songs-json
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - run: npm ci

      - run: npm run build:songs-json

      - run: npm run validate:songs-json

      - name: Commit generated songs json
        id: commit
        run: |
          if git diff --quiet -- data/songs.json data/songs-meta.json; then
            echo "No generated changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/songs.json data/songs-meta.json
            git commit -m "chore: update generated songs json" -m "- 公開CSVから songs.json と songs-meta.json を再生成した。"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run CI for updated songs json
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
